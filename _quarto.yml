# ─────────────────────────────────────────────────────────────
# Einstellungen des Skripts. Ändern Sie nur die Zeilen mit ← .
# Alles andere ist fertig eingerichtet.
# ─────────────────────────────────────────────────────────────
project:
  type: website
  output-dir: docs            # die fertige Webseite landet in docs/
  render:                     # nur diese Seiten werden gebaut
    - index.qmd
    - welcome.qmd
    - grundlagen/*.qmd
    - sitzungen/*.qmd
    - 03-lernspiele.qmd
    - 04-lernkontrolle.qmd
  resources:
    - "interactions/*"        # Lernspiele werden mitkopiert
    - "fonts/*"               # Schrift Outfit (OTH), lokal eingebunden

website:
  title: "Forschungstheorie"                                    # ← Titel
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: "Willkommen"
        href: welcome.qmd
      - section: "Grundlagen"
        contents:
          - text: "Grundbegriffe der Forschungstheorie"
            href: grundlagen/01-grundbegriffe.qmd
      - section: "Sitzungen"
        contents:
          - text: "Seminarüberblick"
            href: index.qmd
          - section: "Block I · Wissenschaftstheorie und Forschungsdesign"
            contents:
              - text: "1 · Einführung: Alltagswissen und Wissenschaft"
                href: sitzungen/01-einfuehrung.qmd
              - text: "2 · Wissenschaftstheoretische Grundlagen"
                href: sitzungen/02-wissenschaftstheorie.qmd
              - text: "3 · Forschungsprozess und Forschungsdesign"
                href: sitzungen/03-forschungsprozess-design.qmd
              - text: "4 · Forschungsfragen und Operationalisierung"
                href: sitzungen/04-forschungsfragen-operationalisierung.qmd
          - section: "Block II · Stichprobe und Datenerhebung"
            contents:
              - text: "5 · Stichprobenziehung I"
                href: sitzungen/05-stichprobenziehung-1.qmd
              - text: "6 · Stichprobenziehung II"
                href: sitzungen/06-stichprobenziehung-2.qmd
              - text: "7 · Datenerhebung qualitativ"
                href: sitzungen/07-datenerhebung-qualitativ.qmd
              - text: "8 · Datenerhebung quantitativ"
                href: sitzungen/08-datenerhebung-quantitativ.qmd
          - section: "Block III · Auswertung, Qualität und Transfer"
            contents:
              - text: "9 · Datenauswertung qualitativ"
                href: sitzungen/09-datenauswertung-qualitativ.qmd
              - text: "10 · Datenauswertung quantitativ"
                href: sitzungen/10-datenauswertung-quantitativ.qmd
              - text: "11 · Gütekriterien"
                href: sitzungen/11-guetekriterien.qmd
              - text: "12 · Ethik und Ergebnisdarstellung"
                href: sitzungen/12-ethik-ergebnisdarstellung.qmd
              - text: "13 · Anwendung wissenschaftlicher Erkenntnisse"
                href: sitzungen/13-anwendung-transfer.qmd
      - section: "Üben"
        contents:
          - text: "Lernspiele"
            href: 03-lernspiele.qmd
          - text: "Lernkontrolle"
            href: 04-lernkontrolle.qmd
  page-footer:
    left: "© Prof. Dr. Mehmet Kart · CC BY-SA 4.0"         # ← Lizenzhinweis
    right: "Erstellt mit [Quarto](https://quarto.org)"

lang: de
toc-title: "Auf dieser Seite"

crossref:
  fig-title: Abbildung
  tbl-title: Tabelle
  fig-prefix: Abbildung
  tbl-prefix: Tabelle

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: fonts/outfit.css            # Schrift Outfit (OTH), ohne Google-Server
    number-sections: false
    toc: true
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    toc-expand: true
    crossrefs-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    callout-appearance: simple
    include-after-body:
      - include/iframe-hoehe.html    # Lernspiele bekommen automatisch die passende Höhe
      - include/theory-panel.html    # Positionen auf Sitzungsseiten aufklappen
